name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:pkg

  # Builds and typechecks each example against the built library, so a change
  # to the public API can't silently break them.
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [as-needed, always]
    name: ${{ matrix.example }} example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/${{ matrix.example }}
      - run: npm run build
        working-directory: examples/${{ matrix.example }}
      - run: npm run typecheck
        working-directory: examples/${{ matrix.example }}
